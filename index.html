<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>codebymarco</title>
    <style>
      .modal {
        position: fixed; inset: 0; width: 100%; height: 100%;
        background-color: rgba(0,0,0,.5);
        display: flex; justify-content: center; align-items: center;
        z-index: 9999;
      }
      .modal-content {
        background: #fff; padding: 20px; border: 1px solid #ccc;
        font-family: Arial, sans-serif; font-size: 16px; text-align: center;
        max-width: 80%; box-shadow: 0 4px 8px rgba(0,0,0,.2);
      }
      h2 { margin: 0; font-size: 28px; }
      .sub { margin-top: 8px; color: #666; font-size: 14px; }
    </style>
  </head>
  <body>
    <!-- <div id="root"></div> -->

    <div class="modal">
      <div class="modal-content">
        <h2 id="retireText">Retiring…</h2>
        <div class="sub" id="retireDate"></div>
      </div>
    </div>

    <script type="module">
      // Target: Dec 31, 2025 in local time (Africa/Johannesburg for you)
      const target = new Date(2025, 11, 31, 23, 59, 59); // months are 0-indexed

      function daysUntil(toDate) {
        const now = new Date();
        // Strip time for "full days left" feel: compare midnight boundaries
        const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const end   = new Date(toDate.getFullYear(), toDate.getMonth(), toDate.getDate());
        const MS_PER_DAY = 24 * 60 * 60 * 1000;
        // Ceil so if there’s any time left in the day, it counts toward remaining days
        return Math.max(0, Math.ceil((end - start) / MS_PER_DAY));
      }

      const h2 = document.getElementById('retireText');
      const sub = document.getElementById('retireDate');

      function render() {
        const d = daysUntil(target);
        if (d > 0) {
          h2.textContent = `Retiring in ${d} day${d === 1 ? '' : 's'}`;
          sub.textContent = `Last day: ${target.toLocaleDateString(undefined, {
            weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
          })}`;
        } else {
          h2.textContent = `Retired 🎉`;
          sub.textContent = `Last day was ${target.toLocaleDateString(undefined, {
            weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
          })}`;
        }
      }

      render();
      // Optional: re-render just after midnight in case the tab stays open
      const msUntilMidnight = (() => {
        const now = new Date();
        const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        return midnight - now;
      })();
      setTimeout(() => { render(); setInterval(render, 24*60*60*1000); }, msUntilMidnight);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
